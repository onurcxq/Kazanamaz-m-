name: APK oluştur

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Dosyaları düzenle
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/onur/kazanamazim

          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          fi

          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ -f MainActivity.java ]; then
            cp MainActivity.java app/src/main/java/com/onur/kazanamazim/MainActivity.java
          fi

          if [ -f styles.xml ]; then
            cp styles.xml app/src/main/res/values/styles.xml
          fi

      - name: APK derle
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KazaNamazim-APK
          path: app/build/outputs/apk/debug/app-debug.apk
